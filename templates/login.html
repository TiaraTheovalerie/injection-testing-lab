<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Caleg Jakarta Timur</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --navy: #1e1b4b;
            --red: #b91c1c;
            --bg: #f1f5f9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-top: 5px solid var(--red);
        }

        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header h1 { color: var(--navy); font-size: 1.8rem; margin: 0; font-weight: 800; letter-spacing: -1px; }
        .login-header p { color: #64748b; font-size: 0.85rem; margin-top: 5px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--navy); margin-bottom: 8px; text-transform: uppercase; }
        
        .input-group { position: relative; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        
        input {
            width: 100%; padding: 12px 15px 12px 40px; border: 1px solid #e2e8f0; border-radius: 8px;
            outline: none; transition: 0.3s; box-sizing: border-box;
        }
        input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(30,27,75,0.1); }

        button {
            width: 100%; padding: 14px; background: var(--navy); color: white; border: none;
            border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        button:hover { background: var(--red); transform: translateY(-2px); }

        .alert {
            padding: 12px; background: #fee2e2; color: var(--red); border-radius: 8px;
            font-size: 0.85rem; margin-bottom: 20px; text-align: center; font-weight: 600;
        }

        @media (max-width: 480px) { .login-card { padding: 30px 20px; } }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h1>TiBi</h1>
            <p>Sistem Caleg Jakarta Timur</p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert"><i class="fas fa-exclamation-circle"></i> {{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label>Username</label>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="Masukkan username" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Masukkan password" required>
                </div>
            </div>

            <button type="submit">LOGIN</button>
        </form>
    </div>

</body>
</html>
