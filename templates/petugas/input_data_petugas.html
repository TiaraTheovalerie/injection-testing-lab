{% extends 'petugas/layout_petugas.html' %}

{% block title %}Tambah Konstituen - SIPECAL{% endblock %}

{% block content %}
<style>
    :root {
        /* Warna disamakan dengan layout_petugas.html */
        --navy: #1e293b;
        --green-primary: #059669; 
        --border: #e2e8f0;
        --text-dark: #1e293b;
        --text-muted: #64748b;
    }

    .form-container { 
        padding: 40px 20px; 
        display: flex; 
        justify-content: center; 
        font-family: 'Roboto', sans-serif;
    }

    .form-card { 
        background: white; 
        width: 100%; 
        max-width: 800px; 
        padding: 35px; 
        border-radius: 12px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        border-top: 6px solid var(--green-primary); /* Aksen Hijau di atas */
    }

    .form-header { margin-bottom: 30px; border-bottom: 1px solid #f1f5f9; padding-bottom: 15px; }
    .form-header h3 { color: var(--navy); margin: 0; font-size: 1.4rem; font-weight: 800; text-transform: uppercase; font-family: 'Montserrat', sans-serif; }
      .form-header h3 i { color: var(--green-primary); } /* Icon Hijau */
    .form-header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 5px; }

    /* Grid System */
    .form-grid { 
        display: grid; 
        grid-template-columns: repeat(2, 1fr); 
        gap: 20px; 
    }

    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
    .form-group label { font-weight: 700; margin-bottom: 8px; color: var(--text-dark); font-size: 0.85rem; }

    .form-group input, .form-group select, .form-group textarea {
        padding: 12px 15px; border: 1px solid var(--border); border-radius: 8px;
        font-family: inherit; font-size: 0.95rem; color: var(--text-dark); outline: none; transition: 0.2s;
    }

    .form-group input:focus, .form-group select:focus { 
        border-color: var(--green-primary); 
        box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1); 
    }

    .full-width { grid-column: span 2; }

    /* Actions */
    .form-actions { 
        display: flex; 
        justify-content: flex-end; 
        gap: 15px; 
        margin-top: 30px; 
        padding-top: 20px; 
        border-top: 1px solid #f1f5f9;
    }

    .btn-cancel { 
        padding: 12px 25px; background: #f8fafc; color: var(--text-muted); 
        text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem;
        border: 1px solid var(--border); transition: 0.2s;
    }
    .btn-cancel:hover { background: #f1f5f9; color: var(--navy); }

    .btn-submit { 
        padding: 12px 30px; background: var(--navy); color: white; border: none; 
        border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: 0.2s;
            text-transform: uppercase;
    }
    .btn-submit:hover { background: var(--green-primary); transform: translateY(-2px); }

    /* RESPONSIVE */
    @media (max-width: 650px) {
        .form-grid { grid-template-columns: 1fr; }
        .full-width { grid-column: span 1; }
        .form-card { padding: 25px; }
        .form-actions { flex-direction: column-reverse; }
        .btn-cancel, .btn-submit { text-align: center; width: 100%; }
    }
</style>

<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <h3><i class="fas fa-user-plus" style="margin-right: 10px;"></i> Tambah Konstituen Baru</h3>
            <p>Data yang diinputkan akan masuk ke dalam database Pusat Komando Pemenangan.</p>
        </div>

        <form action="{{ url_for('petugas.tambah_data_konstituen_petugas') }}" method="POST">
            <div class="form-grid">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" name="nama" placeholder="Contoh: Ahmad Subarjo" required>
                </div>
            
                <div class="form-group">
                    <label>NIK (16 Digit)</label>
                    <input type="text" name="nik" maxlength="16" minlength="16" 
                        pattern="\d*" inputmode="numeric" 
                        placeholder="Masukkan 16 digit NIK" required>
                </div>

                <div class="form-group">
                    <label>Nomor HP/WhatsApp</label>
                    <input type="text" name="no_hp" placeholder="Contoh: 081234567890" required>
                </div>

                <div class="form-group">
                    <label>Wilayah Kecamatan</label>
                    <select name="id_kecamatan" required>
                        <option value="" disabled selected>-- Pilih Kecamatan --</option>
                        {% for k in kecamatans %}
                        <option value="{{ k.id_kecamatan }}">{{ k.nama_kecamatan }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Alamat Lengkap</label>
                    <textarea name="alamat" rows="3" placeholder="Jl. Merdeka No. 10, RT 02/RW 05, Kelurahan..."></textarea>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('petugas.data_konstituen_petugas') }}" class="btn-cancel">Batal</a>
                <button type="submit" class="btn-submit">Simpan Data Konstituen</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
