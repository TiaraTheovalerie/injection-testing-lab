{% extends 'petugas/layout_petugas.html' %}

{% block title %}Edit Konstituen - SIPECAL{% endblock %}

{% block content %}
<style>
    :root {
        /* Mengambil variabel dari layout_petugas.html */
        --navy-dark: #1e293b; 
        --green-primary: #059669; 
        --border: #e2e8f0;
        --text-dark: #1e293b;
        --text-muted: #64748b;
        --bg-gray: #f8fafc;
    }

    .edit-wrapper { padding: 40px 20px; display: flex; justify-content: center; background: #f1f5f9; min-height: 100vh; font-family: 'Roboto', sans-serif; }

    .edit-card { 
        background: white; width: 100%; max-width: 800px; 
        border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        overflow: hidden; border-top: 6px solid var(--green-primary); /* Border atas ganti Hijau */
    }

    /* HEADER */
    .edit-card-header { 
        padding: 20px 25px; background: var(--bg-gray); 
        display: flex; justify-content: space-between; align-items: center;
        border-bottom: 1px solid var(--border);
    }
    .header-title { display: flex; align-items: center; gap: 15px; }
    .header-title i { font-size: 1.5rem; color: var(--green-primary); } /* Icon ganti Hijau */
    .header-title h3 { margin: 0; color: var(--navy-dark); font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.1rem; }
    .header-title p { margin: 0; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }

    /* FORM STYLE */
    .edit-form { padding: 30px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-weight: 700; font-size: 0.85rem; color: var(--text-dark); }
    
    .form-group input, .form-group select, .form-group textarea {
        padding: 12px; border: 1px solid var(--border); border-radius: 6px;
        font-family: inherit; font-size: 0.95rem; outline: none; transition: 0.2s; background: white;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { 
        border-color: var(--green-primary); box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1); 
    }
    .full-width { grid-column: span 2; }

    /* FOOTER BUTTONS */
    .edit-footer { 
        margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border);
        display: flex; justify-content: flex-end; gap: 12px;
    }
    .btn-cancel { 
        padding: 12px 25px; background: #f1f5f9; color: var(--text-muted); 
        text-decoration: none; border-radius: 6px; font-weight: 700; transition: 0.2s; font-size: 0.9rem;
    }
    .btn-save { 
        padding: 12px 30px; background: var(--navy-dark); color: white; 
        border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 0.9rem;
        text-transform: uppercase;
    }
    .btn-save:hover { background: var(--green-primary); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(5, 150, 105, 0.3); }

    /* RESPONSIVE */
    @media (max-width: 600px) { 
        .edit-wrapper { padding: 10px; }
        .edit-form { padding: 20px; }
        .form-grid { grid-template-columns: 1fr; gap: 15px; } 
        .full-width { grid-column: span 1; } 
        .edit-footer { flex-direction: column-reverse; }
        .btn-cancel, .btn-save { width: 100%; text-align: center; }
    }
</style>

<div class="edit-wrapper">
    <div class="edit-card">
        <div class="edit-card-header">
            <div class="header-title">
                <i class="fas fa-user-edit"></i>
                <div>
                    <h3>Edit Data Konstituen</h3>
                    <p>ID Pendukung: #{{ p.id_pendukung }}</p>
                </div>
            </div>
            <a href="{{ url_for('petugas.data_konstituen_petugas') }}" style="color: var(--text-muted);"><i class="fas fa-times"></i></a>
        </div>

        <form action="{{ url_for('petugas.edit_konstituen_petugas', id=p.id_pendukung) }}" method="POST" class="edit-form">
            <div class="form-grid">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" name="nama" value="{{ p.nama }}" required placeholder="Contoh: Budi Santoso">
                </div>
                <div class="form-group">
                    <label>NIK (16 Digit)</label>
                    <input type="text" name="nik" value="{{ p.nik }}" required maxlength="16" placeholder="Masukkan 16 digit NIK">
                </div>

                <div class="form-group">
                    <label>Nomor WhatsApp/HP</label>
                    <input type="text" name="no_hp" value="{{ p.no_hp }}" required placeholder="0812xxxx">
                </div>
                <div class="form-group">
                    <label>Wilayah Kecamatan</label>
                    <select name="id_kecamatan" required>
                        <option value="" disabled>Pilih Kecamatan</option>
                        {% for k in kecamatans %}
                        <option value="{{ k.id_kecamatan }}" {{ 'selected' if k.id_kecamatan == p.id_kecamatan }}>
                            {{ k.nama_kecamatan }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group full-width" style="margin-bottom: 20px;">
                <label>Alamat Lengkap</label>
                <textarea name="alamat" rows="3" placeholder="Jl. Raya No. 123, RT/RW...">{{ p.alamat }}</textarea>
            </div>

            <div class="edit-footer">
                <a href="{{ url_for('petugas.data_konstituen_petugas') }}" class="btn-cancel">Batal</a>
                <button type="submit" class="btn-save">Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
